# DeepStone pre-commit — 検出のみ（autofix 系は入れない）
# 理由: 書き換え系フックは Obsidian Git の自動コミットと衝突し、
#       commit が黙って失敗し続ける状態を作るため。
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks protect --staged --verbose --redact
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: detect-private-key
        # 除外はここだけ。プラグインの main.js は配布されたサードパーティのバンドル
        # （4MB超の minified JS）で、暗号ライブラリが PEM/PuTTY 形式を解析するために
        # 持っている書式ヘッダの文字列リテラル（PuTTY 形式のヘッダ等）を誤検出したもの。
        # 実鍵ではない（PEM 本体の base64 ブロックが後続しないことを確認済み）。
        # 実鍵が入る data.json の方は .gitignore で追跡自体を外してある。
        exclude: '^\.obsidian/plugins/[^/]+/main\.js$'
      - id: check-merge-conflict      # Obsidian Git の sync 衝突マーカー残留を検出
      - id: check-case-conflict       # iOS / iCloud 同期でのファイル名衝突を検出
      - id: check-added-large-files
        args: ['--maxkb=5000']        # 添付画像があるので緩める
